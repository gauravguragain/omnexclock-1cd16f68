<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Manifest is injected by the inline script below based on the current URL -->
    <script>
      (function() {
        var p = window.location.pathname;
        var m = p.match(/^\/t\/([^/]+)\/ck/) || p.match(/^\/b\/([^/]+)\/kiosk/);
        var link = document.createElement("link");
        link.rel = "manifest";
        if (m) {
          var mf = {
            name: "Kiosk Clock-In",
            short_name: "Kiosk",
            description: "Employee kiosk clock-in terminal",
            theme_color: "#000000",
            background_color: "#000000",
            display: "standalone",
            orientation: "portrait",
            start_url: "/t/" + m[1] + "/ck",
            scope: "/",
            id: "/kiosk/" + m[1],
            categories: ["business", "productivity"],
            icons: [
              { src: "/pwa-icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
              { src: "/pwa-icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
              { src: "/pwa-icon-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
            ]
          };
          link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: "application/json" }));
          document.title = "Kiosk Clock-In";
        } else {
          link.href = "/manifest.webmanifest";
        }
        document.currentScript.parentNode.insertBefore(link, document.currentScript.nextSibling);
        // Block any later script from adding a duplicate manifest
        new MutationObserver(function(muts) {
          muts.forEach(function(mut) {
            mut.addedNodes.forEach(function(node) {
              if (node.nodeName === "LINK" && node.rel === "manifest" && node !== link) {
                node.remove();
              }
            });
          });
        }).observe(document.head, { childList: true });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Pro Regal Pavilion</title>
    <meta name="description" content="Pro Regal Pavilion workforce, rostering, timesheet and employee management.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/pwa-icon-192.png">
    <meta name="theme-color" content="#12100f">
    <meta name="author" content="Pro Regal Pavilion Pty Ltd" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Pro Regal Pavilion">
    <meta name="twitter:title" content="Pro Regal Pavilion">
    <meta property="og:description" content="Pro Regal Pavilion workforce, rostering, timesheet and employee management.">
    <meta name="twitter:description" content="Pro Regal Pavilion workforce, rostering, timesheet and employee management.">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
